name: Strip trailing newlines
on:
  push:
    paths:
      - .github/workflows/strip-newlines.yml
permissions:
  contents: write
jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip trailing newlines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in [Path("package.json"), Path(".makefun/owner.json")]:
              data = p.read_bytes()
              if data.endswith(b"\n"):
                  p.write_bytes(data[:-1])
          PY
      - name: Commit if changed
        run: |
          git config user.name "Rahulboss7788"
          git config user.email "Rahulboss7788@users.noreply.github.com"
          git add package.json .makefun/owner.json
          git diff --cached --quiet || git commit -m "Strip trailing newlines from package.json and .makefun/owner.json"
          git push
